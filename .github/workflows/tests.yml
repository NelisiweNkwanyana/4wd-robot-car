# Builds the real firmware against the mock Arduino core and runs the logic tests
# on every push, so the README badge shows whether they pass.
name: Logic tests
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run 92 host-side logic tests
        run: cd simulation/host-tests && bash run_tests.sh
